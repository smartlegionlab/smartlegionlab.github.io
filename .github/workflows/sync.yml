name: Sync to Custom Domain Repo

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Push to Mirror Repo with CNAME
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT is empty"
            exit 1
          fi

          git config --local --unset-all http.https://github.com/.extraheader || true

          echo "smartlegionlab.com" > CNAME
          rm -rf .github

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync mirror with CNAME" || true

          git remote add mirror "https://x-access-token:${GH_PAT}@github.com/smartlegionlab/smartlegionlab-com.git"
          git push mirror master:master --force