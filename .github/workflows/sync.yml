name: Sync to Custom Domain Repo

on:
  push:
    branches: [master]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Mirror Repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT is empty. Check repository secrets."
            exit 1
          fi
          git remote add mirror "https://github.com/smartlegionlab/smartlegionlab-com.git"
          git -c http.extraHeader="AUTHORIZATION: bearer ${GH_PAT}" push mirror master:master --force